name: CI

on:
  push:
  pull_request:

# Cancel a superseded run on the same branch/PR rather than letting both finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — lint, golden tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Includes the Phase 0 golden tests and the 1e-9 reference lock — the gate every change must pass.
      - run: npm test
      - run: npm run build

  server:
    name: Server — syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Parse-only check of every server module (no install or DB needed).
      - name: node --check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
