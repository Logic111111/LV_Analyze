server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. A bare `proxy_pass http://server:4000;` resolves once at
  # nginx startup via the OS resolver and hard-fails ("host not found in upstream") if the
  # server container isn't already up and registered at that instant — with no retry. Pairing
  # a resolver with a variable in proxy_pass makes nginx resolve lazily, per-request, instead.
  resolver 127.0.0.11 valid=10s;

  location / {
    try_files $uri /index.html;
  }

  # PWA (P7.8). The service worker, the manifest and index.html must never be served stale from
  # an HTTP cache, or a new release would never reach installed clients; the hashed files under
  # /assets/ never change, so they can be cached for good.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Same-origin proxy to the API container so the auth cookie stays
  # same-site (SameSite=Lax) with no extra CORS/cookie configuration.
  location /api/ {
    # No URI part after the variable: in variable form, proxy_pass does not rewrite the
    # location prefix the way a static proxy_pass does, so this forwards the original
    # /api/... request URI unchanged — which is exactly what the Express app expects, since
    # its routes are mounted at /api/... too.
    set $upstream_server http://server:4000;
    proxy_pass $upstream_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
